services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./platform.db
      FRONTEND_ORIGIN: http://localhost:5173
      AUTH_DISABLED: "true"
      AWS_MODE: auto
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  backend-data:
